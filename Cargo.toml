[package]
name = "cosmic-doro"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "A cosmic pomodoro focus timer for the COSMIC desktop"
repository = "https://github.com/phoscoder/cosmic-doro"
default-run = "cosmic-doro"

[lib]
name = "doro"
path = "src/lib.rs"

[[bin]]
name = "cosmic-doro"
path = "src/bin/cosmic-doro.rs"

[[bin]]
name = "cosmic-doro-applet"
path = "src/bin/cosmic-doro-applet.rs"

[[bin]]
name = "cosmic-doro-tray"
path = "src/bin/cosmic-doro-tray.rs"

[dependencies]
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
notify-rust = { version = "4", default-features = false, features = ["z"] }
ksni = { version = "0.3.7", features = ["blocking"] }

[dependencies.libcosmic]
git = "https://github.com/pop-os/libcosmic"
rev = "12ae9ef3a8b9e36e6fb8459444341b680c2ccc7a"
default-features = false
features = ["applet", "single-instance", "tokio", "winit", "wayland", "multi-window", "a11y", "dbus-config", "x11"]

[profile.release]
opt-level = 3
lto = "thin"
