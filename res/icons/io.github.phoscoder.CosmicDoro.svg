<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <radialGradient id="space" cx="38%" cy="30%" r="80%">
      <stop offset="0" stop-color="#3b2a7a"/>
      <stop offset="0.55" stop-color="#1a1540"/>
      <stop offset="1" stop-color="#090818"/>
    </radialGradient>
    <radialGradient id="tomato" cx="38%" cy="34%" r="72%">
      <stop offset="0" stop-color="#ff8a6b"/>
      <stop offset="0.5" stop-color="#f2493b"/>
      <stop offset="1" stop-color="#b0221c"/>
    </radialGradient>
    <linearGradient id="orbit" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7ee8fa"/>
      <stop offset="0.5" stop-color="#b892ff"/>
      <stop offset="1" stop-color="#ff7eb6"/>
    </linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="10"/>
    </filter>
    <clipPath id="disc"><circle cx="256" cy="256" r="240"/></clipPath>
  </defs>

  <!-- deep space disc -->
  <circle cx="256" cy="256" r="240" fill="url(#space)"/>
  <g clip-path="url(#disc)" fill="#fff">
    <circle cx="96" cy="140" r="2.4" opacity=".9"/>
    <circle cx="130" cy="88" r="1.6" opacity=".7"/>
    <circle cx="402" cy="120" r="2.8" opacity=".9"/>
    <circle cx="430" cy="210" r="1.5" opacity=".6"/>
    <circle cx="70" cy="300" r="1.8" opacity=".7"/>
    <circle cx="120" cy="420" r="2.2" opacity=".8"/>
    <circle cx="390" cy="410" r="1.7" opacity=".7"/>
    <circle cx="330" cy="70" r="1.4" opacity=".6"/>
    <circle cx="200" cy="452" r="1.4" opacity=".5"/>
    <circle cx="455" cy="330" r="2" opacity=".7"/>
    <path d="M404 166 l4 10 10 4 -10 4 -4 10 -4 -10 -10 -4 10 -4z" opacity=".95"/>
    <path d="M100 210 l3 7 7 3 -7 3 -3 7 -3 -7 -7 -3 7 -3z" opacity=".8"/>
  </g>

  <!-- back half of orbit ring -->
  <g transform="rotate(-18 256 284)">
    <ellipse cx="256" cy="284" rx="214" ry="56" fill="none" stroke="url(#orbit)" stroke-width="14" opacity=".55"/>
  </g>

  <!-- glow + tomato planet -->
  <circle cx="256" cy="284" r="138" fill="#ff5a4e" opacity=".45" filter="url(#glow)"/>
  <circle cx="256" cy="284" r="132" fill="url(#tomato)"/>

  <!-- dial: remaining-time arc + ticks + hand -->
  <circle cx="256" cy="290" r="92" fill="none" stroke="#ffffff" stroke-opacity=".18" stroke-width="16"/>
  <path d="M256 198 A92 92 0 1 1 164 290" fill="none" stroke="#fff3ea" stroke-width="16" stroke-linecap="round"/>
  <g stroke="#fff3ea" stroke-width="5" stroke-linecap="round" opacity=".85">
    <line x1="256" y1="224" x2="256" y2="236"/>
    <line x1="322" y1="290" x2="310" y2="290"/>
    <line x1="256" y1="356" x2="256" y2="344"/>
    <line x1="190" y1="290" x2="202" y2="290"/>
  </g>
  <line x1="256" y1="290" x2="300" y2="252" stroke="#fff3ea" stroke-width="9" stroke-linecap="round"/>
  <circle cx="256" cy="290" r="11" fill="#fff3ea"/>
  <!-- glossy highlight -->
  <ellipse cx="208" cy="226" rx="40" ry="22" fill="#fff" opacity=".18" transform="rotate(-30 208 226)"/>

  <!-- front half of orbit ring + moon -->
  <g transform="rotate(-18 256 284)">
    <path d="M42 284 A214 56 0 0 0 470 284" fill="none" stroke="url(#orbit)" stroke-width="14" stroke-linecap="round"/>
    <circle cx="420" cy="319" r="17" fill="#e9e4ff"/>
    <circle cx="414" cy="314" r="5" fill="#c3baf0"/>
  </g>
</svg>
